<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Simple Chat</title>
  </head>
  <body>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Отправить</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const messages = document.getElementById("messages");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (input.value) {
          // Отправляем сообщение на сервер
          socket.emit("chat message", input.value);
          input.value = "";
        }
      });

      // Слушаем сообщения от сервера (рассылку для всех)
      socket.on("chat message", (msg) => {
        const item = document.createElement("li");
        item.textContent = msg;
        messages.appendChild(item);
      });

      // Слушаем подтверждение от сервера (только для нас)
      socket.on("server confirmation", (confirmMsg) => {
        console.log("%c" + confirmMsg, "color: green; font-weight: bold;");
      });
    </script>
  </body>
</html>
