<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Homework 9 Test</title>
  </head>

  <body>
    <h1>Homework 9</h1>

    <hr />

    <h3>Регистрация</h3>

    <input id="regUsername" placeholder="username" />

    <input id="regName" placeholder="name" />

    <input id="regEmail" placeholder="email" />

    <input id="regPassword" type="password" placeholder="password" />

    <select id="regRole">
      <option value="user">user</option>

      <option value="admin">admin</option>
    </select>

    <button onclick="register()">Register</button>

    <hr />

    <h3>Логин</h3>

    <input id="loginUsername" placeholder="username" />
    <input id="loginPassword" type="password" placeholder="password" />

    <button onclick="login()">Login</button>

    <hr />

    <h3>Смена пароля</h3>

    <input id="oldPassword" type="password" placeholder="старый пароль" />

    <input id="newPassword" type="password" placeholder="новый пароль" />

    <button onclick="changePassword()">Change password</button>

    <hr />

    <h3>Удаление аккаунта</h3>

    <input id="deletePassword" type="password" placeholder="пароль" />

    <button onclick="deleteAccount()">Delete account</button>

    <hr />

    <h3>Смена email</h3>

    <input id="newEmail" placeholder="новый email" />

    <input id="emailPassword" type="password" placeholder="пароль" />

    <button onclick="changeEmail()">Change email</button>

    <hr />

    <h3>Admin</h3>

    <button onclick="admin()">GET /admin</button>

    <hr />

    <pre id="result"></pre>

    <script>
      const API = "http://127.0.0.1:3333";

      const result = document.getElementById("result");

      let currentUser = null;

      function show(data) {
        result.textContent = JSON.stringify(data, null, 2);
      }

      async function register() {
        const body = {
          username: document.getElementById("regUsername").value,

          name: document.getElementById("regName").value,

          email: document.getElementById("regEmail").value,

          password: document.getElementById("regPassword").value,

          role: document.getElementById("regRole").value,
        };

        try {
          const response = await fetch("http://127.0.0.1:3333/register", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify(body),
          });

          const data = await response.json();

          show(data);
        } catch (error) {
          show(error);
        }
      }

      async function login() {
        const body = {
          username: loginUsername.value,

          password: loginPassword.value,
        };

        const response = await fetch(`${API}/login`, {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(body),
        });

        const data = await response.json();

        currentUser = data.user;

        localStorage.setItem("user", JSON.stringify(data.user));

        show(data);
      }

      async function changePassword() {
        const body = {
          username: currentUser.username,

          password: oldPassword.value,

          newPassword: newPassword.value,
        };

        const response = await fetch(`${API}/change-password`, {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(body),
        });

        show(await response.json());
      }

      async function deleteAccount() {
        const body = {
          username: currentUser.username,

          password: deletePassword.value,
        };

        const response = await fetch(`${API}/delete-account`, {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(body),
        });

        show(await response.text());
      }

      async function changeEmail() {
        const body = {
          username: currentUser.username,

          password: emailPassword.value,

          newEmail: newEmail.value,
        };

        const response = await fetch(`${API}/change-email`, {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(body),
        });

        show(await response.json());
      }

      async function admin() {
        const response = await fetch(`${API}/admin`);

        show(await response.json());
      }
    </script>
  </body>
</html>
