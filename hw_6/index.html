<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const url = "http://127.0.0.1:3333";

      fetch(url + "/userdata", {
        method: "POST",
        body: JSON.stringify({
          username: "Alice",
          email: "alice@gmail.com",
        }),
        headers: {
          "Content-Type": "application/json",
        },
      })
        .then((r) => r.json())
        .then(console.log)
        .catch(console.error);
    </script>
  </body>
</html>
